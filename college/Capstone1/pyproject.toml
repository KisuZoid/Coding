[project]
name = "autoinspect-x"
version = "0.0.0"
description = "Multimodal deep learning for vehicle damage segmentation and uncertainty-aware repair cost estimation"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "pytest>=8.4",
]

[tool.uv]
# This repository is a workspace root, not an installable package.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ml/experiments"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplification
    "ARG",  # unused arguments
    "PTH",  # prefer pathlib
    "RUF",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires external services",
    "slow: long-running; excluded from the default run",
]
