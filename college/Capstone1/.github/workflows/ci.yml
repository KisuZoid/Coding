name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend gates (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install dev + CPU runtime dependencies
        run: |
          uv sync --group dev
          uv pip install --python .venv -r requirements-ci.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Ruff lint
        run: uv run ruff check apps/ ml/ tests/ conftest.py
      - name: Ruff format
        run: uv run ruff format --check apps/ ml/ tests/ conftest.py
      - name: Mypy (strict)
        run: uv run python -m mypy apps/ ml/ tests/
      - name: Pytest
        run: uv run python -m pytest tests/

  frontend:
    name: Frontend gates (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  e2e:
    name: Playwright (browser E2E)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: apps/web
    env:
      # The committed demo checkpoint is git-ignored, so the real-engine
      # journeys skip on CI exactly as the pytest suite does; the shell and
      # honesty-UX tests still run. BACKEND_CMD overrides the Playwright
      # config's default conda launcher for the CI venv.
      BACKEND_CMD: python -m uvicorn apps.api.main:app --port 8000 --log-level warning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install backend runtime deps
        run: |
          (cd ../.. && uv sync --group dev && uv pip install --python .venv -r requirements-ci.txt)
          echo "$PWD/../../.venv/bin" >> "$GITHUB_PATH"
      - name: Install frontend deps
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Playwright browsers (system Chrome is used via channel: chrome)
        run: npx playwright install chrome
      - name: Run Playwright suite
        run: npx playwright test